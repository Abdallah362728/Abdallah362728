<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1420"/>
      <stop offset="1" stop-color="#0A0F16"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#5E7186" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <style>
    .w{opacity:0;animation:cyc 12.5s linear infinite}
    .w2{animation-delay:2.5s}.w3{animation-delay:5s}.w4{animation-delay:7.5s}.w5{animation-delay:10s}
    @keyframes cyc{0%,20.5%,100%{opacity:0}2.5%,18%{opacity:1}}
    .t{animation:fl 3.4s ease-in-out infinite alternate}
    .t2{animation-delay:.5s}.t3{animation-delay:1s}.t4{animation-delay:1.5s}.t5{animation-delay:2s}
    @keyframes fl{from{transform:translateY(0)}to{transform:translateY(-8px)}}
  </style>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- project spectrum bar -->
  <rect x="0" y="0" width="240" height="5" fill="#E8A33D"/>
  <rect x="240" y="0" width="240" height="5" fill="#8AB6E8"/>
  <rect x="480" y="0" width="240" height="5" fill="#C6F04E"/>
  <rect x="720" y="0" width="240" height="5" fill="#34D399"/>
  <rect x="960" y="0" width="240" height="5" fill="#22D3EE"/>

  <!-- header -->
  <text x="80" y="112" fill="#F0F6FC" font-size="62" font-weight="800" letter-spacing="-1.5">Abdallah Farhat</text>
  <text x="1120" y="58" text-anchor="end" fill="#5E7186" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="1">◉ Erlangen, Germany</text>
  <text x="82" y="156" fill="#8B98A9" font-size="20">I take messy, real-world things and turn them into software that gets used.</text>

  <!-- rotating terminal line -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17.5">
    <text x="82" y="208" fill="#5E7186">$ now digitizing:</text>
    <text class="w"    x="278" y="208" fill="#E8A33D" font-weight="700">a car's fuel receipts</text>
    <text class="w w2" x="278" y="208" fill="#8AB6E8" font-weight="700">a walk-in gelato freezer</text>
    <text class="w w3" x="278" y="208" fill="#C6F04E" font-weight="700">my crew's workouts</text>
    <text class="w w4" x="278" y="208" fill="#34D399" font-weight="700">a bilingual health course</text>
    <text class="w w5" x="278" y="208" fill="#22D3EE" font-weight="700">60,000 handwritten digits</text>
  </g>

  <!-- ===== project tiles ===== -->
  <!-- CARS -->
  <g transform="translate(124,246)">
    <g class="t">
      <rect width="92" height="92" rx="18" fill="#111927" stroke="#223140"/>
      <g transform="translate(46,44)" fill="none" stroke="#E8A33D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-30 12 H30"/>
        <path d="M-30 12 v-8 h11 l9 -10 h19 l13 10 h8 v8"/>
        <circle cx="-16" cy="12" r="6" fill="#111927"/>
        <circle cx="16" cy="12" r="6" fill="#111927"/>
      </g>
    </g>
  </g>
  <!-- GELATO -->
  <g transform="translate(339,246)">
    <g class="t t2">
      <rect width="92" height="92" rx="18" fill="#111927" stroke="#223140"/>
      <g transform="translate(46,46)">
        <path d="M-9 -1 L0 19 L9 -1 Z" fill="none" stroke="#8AB6E8" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="-7" cy="-8" r="7.5" fill="#8FBF6E"/>
        <circle cx="7" cy="-8" r="7.5" fill="#F4A6C0"/>
        <circle cx="0" cy="-17" r="7.5" fill="#8AB6E8"/>
      </g>
    </g>
  </g>
  <!-- FITNESS -->
  <g transform="translate(554,246)">
    <g class="t t3">
      <rect width="92" height="92" rx="18" fill="#111927" stroke="#223140"/>
      <g transform="translate(46,44)" fill="#C6F04E">
        <rect x="-14" y="-3" width="28" height="6" rx="2"/>
        <rect x="-22" y="-12" width="7" height="24" rx="2"/>
        <rect x="15" y="-12" width="7" height="24" rx="2"/>
        <rect x="-28" y="-8" width="5" height="16" rx="2" opacity="0.7"/>
        <rect x="23" y="-8" width="5" height="16" rx="2" opacity="0.7"/>
      </g>
    </g>
  </g>
  <!-- NUTRITION -->
  <g transform="translate(769,246)">
    <g class="t t4">
      <rect width="92" height="92" rx="18" fill="#111927" stroke="#223140"/>
      <g transform="translate(46,44)">
        <circle r="17" fill="none" stroke="#34D399" stroke-width="2"/>
        <path d="M0 0 L0 -17 A17 17 0 0 1 14.7 8.5 Z" fill="#34D399" opacity="0.85"/>
        <path d="M0 0 L14.7 8.5 A17 17 0 0 1 -14.7 8.5 Z" fill="#2DD4BF" opacity="0.55"/>
        <path d="M0 0 L-14.7 8.5 A17 17 0 0 1 0 -17 Z" fill="#A7F3D0" opacity="0.3"/>
      </g>
    </g>
  </g>
  <!-- MNIST -->
  <g transform="translate(984,246)">
    <g class="t t5">
      <rect width="92" height="92" rx="18" fill="#111927" stroke="#223140"/>
      <g transform="translate(46,44)">
        <path d="M-18 -6 H18 M-18 6 H18 M-6 -18 V18 M6 -18 V18" stroke="#22384A" stroke-width="1"/>
        <text y="13" text-anchor="middle" fill="#4ADE80" font-size="38" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">3</text>
      </g>
    </g>
  </g>

  <!-- tile labels -->
  <g fill="#5E7186" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="2" text-anchor="middle">
    <text x="170" y="372">CARS</text>
    <text x="385" y="372">GELATO</text>
    <text x="600" y="372">FITNESS</text>
    <text x="815" y="372">NUTRITION</text>
    <text x="1030" y="372">MNIST</text>
  </g>
</svg>
